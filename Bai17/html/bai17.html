<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 17 - Kiểm tra biểu mẫu</title>
    <!-- Tích hợp Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light-orange d-flex justify-content-center align-items-center min-vh-100 py-5">

    <div class="form-container bg-white p-4 p-md-5 shadow-sm">
        
        <!-- Tiêu đề form -->
        <h3 class="text-title fw-bold mb-1">Đăng ký tài khoản</h3>
        <p class="text-secondary small mb-4 pb-2">Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>

        <!-- Biểu mẫu (Form) -->
        <form id="registerForm">
            
            <!-- Họ và tên -->
            <div class="mb-3">
                <label for="name" class="form-label fw-bold text-secondary mb-1 small">Họ và tên</label>
                <input type="text" id="name" class="form-control custom-input" placeholder="Nguyễn Văn An">
                <div id="nameMsg" class="mt-1 fw-bold"></div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label fw-bold text-secondary mb-1 small">Email</label>
                <input type="text" id="email" class="form-control custom-input" placeholder="an.nv@tlu.edu.vn">
                <div id="emailMsg" class="mt-1 fw-bold"></div>
            </div>

            <!-- Mật khẩu -->
            <div class="mb-3">
                <label for="password" class="form-label fw-bold text-secondary mb-1 small">Mật khẩu</label>
                <input type="password" id="password" class="form-control custom-input" placeholder="••••••">
                <div id="passMsg" class="mt-1 fw-bold"></div>
            </div>

            <!-- Xác nhận mật khẩu -->
            <div class="mb-4">
                <label for="confirmPassword" class="form-label fw-bold text-secondary mb-1 small">Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" class="form-control custom-input" placeholder="••••••">
                <div id="confirmMsg" class="mt-1 fw-bold"></div>
            </div>

            <!-- Nút Đăng ký -->
            <button type="submit" class="btn btn-register w-100 py-2">Đăng ký</button>
            
        </form>
    </div>

    <!-- Nhúng file JS -->
    <script src="../js/script.js"></script>
</body>
</html>
