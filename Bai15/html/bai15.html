<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 15 - Máy tính đơn giản</title>
    <!-- Tích hợp Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100">

    <div class="calculator-container p-4">
        <!-- Màn hình máy tính -->
        <div class="screen mb-4 p-3 d-flex flex-column justify-content-end align-items-end text-end">
            <div id="expression" class="expression-text"></div>
            <div id="result" class="result-text">0</div>
        </div>

        <!-- Bàn phím lưới 4 cột -->
        <div class="row row-cols-4 g-2">
            <!-- Hàng 1 -->
            <div class="col"><button class="btn btn-calc btn-clear w-100" onclick="clearScreen()">C</button></div>
            <div class="col"><button class="btn btn-calc btn-op w-100" onclick="appendValue('(')">(</button></div>
            <div class="col"><button class="btn btn-calc btn-op w-100" onclick="appendValue(')')">)</button></div>
            <div class="col"><button class="btn btn-calc btn-op w-100" onclick="appendValue('/')">÷</button></div>

            <!-- Hàng 2 -->
            <div class="col"><button class="btn btn-calc btn-num w-100" onclick="appendValue('7')">7</button></div>
            <div class="col"><button class="btn btn-calc btn-num w-100" onclick="appendValue('8')">8</button></div>
            <div class="col"><button class="btn btn-calc btn-num w-100" onclick="appendValue('9')">9</button></div>
            <div class="col"><button class="btn btn-calc btn-op w-100" onclick="appendValue('*')">×</button></div>

            <!-- Hàng 3 -->
            <div class="col"><button class="btn btn-calc btn-num w-100" onclick="appendValue('4')">4</button></div>
            <div class="col"><button class="btn btn-calc btn-num w-100" onclick="appendValue('5')">5</button></div>
            <div class="col"><button class="btn btn-calc btn-num w-100" onclick="appendValue('6')">6</button></div>
            <div class="col"><button class="btn btn-calc btn-op w-100" onclick="appendValue('-')">-</button></div>

            <!-- Hàng 4 -->
            <div class="col"><button class="btn btn-calc btn-num w-100" onclick="appendValue('1')">1</button></div>
            <div class="col"><button class="btn btn-calc btn-num w-100" onclick="appendValue('2')">2</button></div>
            <div class="col"><button class="btn btn-calc btn-num w-100" onclick="appendValue('3')">3</button></div>
            <div class="col"><button class="btn btn-calc btn-op w-100" onclick="appendValue('+')">+</button></div>

            <!-- Hàng 5 -->
            <div class="col"><button class="btn btn-calc btn-num w-100" onclick="appendValue('%')">%</button></div>
            <div class="col"><button class="btn btn-calc btn-num w-100" onclick="appendValue('0')">0</button></div>
            <div class="col"><button class="btn btn-calc btn-num w-100" onclick="appendValue('.')">.</button></div>
            <div class="col"><button class="btn btn-calc btn-equal w-100" onclick="calculateResult()">=</button></div>
        </div>
    </div>

    <!-- Nhúng file JS -->
    <script src="../js/script.js"></script>
</body>
</html>
