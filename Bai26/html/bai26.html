<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 - Form đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">
    
    <div class="card shadow border-0" style="width: 100%; max-width: 650px;">
        <div class="card-header bg-success text-white text-center py-3">
            <h4 class="mb-0 fw-bold">Đăng ký tham gia CLB Lập trình Web</h4>
        </div>
        
        <div class="card-body p-4">
            <form class="row g-3" action="#">
                <div class="col-md-6">
                    <label for="fullName" class="form-label">Họ và tên</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Nguyễn Văn A" required>
                </div>
                
                <div class="col-md-6">
                    <label for="studentId" class="form-label">Mã sinh viên</label>
                    <input type="text" class="form-control" id="studentId" placeholder="22xxxxxx" required>
                </div>
                
                <div class="col-md-6">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                </div>
                
                <div class="col-md-6">
                    <label for="phone" class="form-label">Số điện thoại</label>
                    <input type="tel" class="form-control" id="phone" placeholder="09xxxxxxxx" required>
                </div>
                
                <div class="col-12">
                    <label class="form-label d-block">Trình độ</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="level" id="level1" value="coban" checked>
                        <label class="form-check-label" for="level1">Cơ bản</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="level" id="level2" value="kha">
                        <label class="form-check-label" for="level2">Khá</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="level" id="level3" value="tot">
                        <label class="form-check-label" for="level3">Tốt</label>
                    </div>
                </div>
                
                <div class="col-12">
                    <label for="classSelect" class="form-label">Chọn lớp</label>
                    <select class="form-select" id="classSelect" required>
                        <option value="">Chọn lớp...</option>
                        <option value="67CNTT1">67CNTT1</option>
                        <option value="67CNTT2">67CNTT2</option>
                        <option value="67CNTT3">67CNTT3</option>
                    </select>
                </div>
                
                <div class="col-12">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="commitment" required checked>
                        <label class="form-check-label" for="commitment">
                            Tôi cam kết tự làm bài và quay video OBS
                        </label>
                    </div>
                </div>
                
                <div class="col-12 d-flex justify-content-end gap-2 mt-3">
                    <button type="reset" class="btn btn-outline-secondary px-4">Nhập lại</button>
                    <button type="submit" class="btn btn-success px-4">Đăng ký</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
