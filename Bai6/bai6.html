<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng danh sách món ăn</title>
    <link rel="stylesheet" href="css/style.css ">
</head>
<body>

            <img class="food-img" src="image/Bat.gif" alt="">
        </div>

        <div class="right-column">

            <table>

                    <tr>
                        <th class="col-stt">STT</th>

                <tbody>
                    <tr>
                        <td class="align-item">1</td>

                    </tr>
                    <tr>
                        <td class="align-item">5</td>
                        <td>Bánh Gai Ninh Giang</td>
                    </tr>
                    <tr>
                        <td class="align-item">6</td>
                        <td>Bún Thang Hà Nội</td>
                    </tr>
                    <tr>
                        <td class="align-item">7</td>
                        <td>Canh Lằng</td>
                    </tr>
                    <tr>
                        <td class="align-item">8</td>
                        <td>Vịt quay Lạng Sơn</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</html>
