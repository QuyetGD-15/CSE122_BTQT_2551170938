<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 - Bảng điều khiển</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

    <div class="d-flex">
        
        <nav class="sidebar text-white p-3">
            <h5 class="fw-bold mb-4 px-2">CSE.TLU Admin</h5>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="#" class="sidebar-link active">Bảng điều khiển</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="sidebar-link">Bài tập</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="sidebar-link">Sinh viên</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="sidebar-link">Điểm số</a>
                </li>
            </ul>
        </nav>

        <main class="flex-grow-1 p-4 p-md-5">
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold m-0">Bảng điều khiển</h3>
                <div>
                    <span class="badge bg-warning text-dark me-2 p-2">3 bài mới</span>
                    <button class="btn btn-primary btn-sm px-3 py-2">Xuất báo cáo</button>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <p class="text-secondary small mb-1">Sinh viên</p>
                        <h3 class="fw-bold mb-3">128</h3>
                        <div class="progress" style="height: 6px;">
                            <div class="progress-bar bg-primary" style="width: 80%;"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <p class="text-secondary small mb-1">Đã nộp</p>
                        <h3 class="fw-bold mb-3">96</h3>
                        <div class="progress" style="height: 6px;">
                            <div class="progress-bar bg-success" style="width: 75%;"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <p class="text-secondary small mb-1">Chưa nộp</p>
                        <h3 class="fw-bold mb-3">32</h3>
                        <div class="progress" style="height: 6px;">
                            <div class="progress-bar bg-danger" style="width: 25%;"></div>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card border-0 shadow-sm h-100 p-3">
                        <p class="text-secondary small mb-1">Điểm TB</p>
                        <h3 class="fw-bold mb-3">7.8</h3>
                        <div class="progress" style="height: 6px;">
                            <div class="progress-bar bg-warning" style="width: 78%;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-2 px-4">
                    <h6 class="fw-bold m-0">Tiến độ theo chương</h6>
                </div>
                <div class="card-body px-4 pb-4 pt-2">
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                            Chương 1 — HTML5
                            <span class="badge bg-success rounded-pill" style="width: 50px;">100%</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                            Chương 2 — JavaScript
                            <span class="badge bg-info text-white rounded-pill" style="width: 50px;">82%</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                            Chương 3 — CSS3
                            <span class="badge bg-info text-white rounded-pill" style="width: 50px;">74%</span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0 py-3">
                            Chương 4 — Bootstrap 5
                            <span class="badge bg-secondary rounded-pill" style="width: 50px;">45%</span>
                        </li>
                    </ul>
                </div>
            </div>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
