<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang liên hệ (biểu mẫu HTML)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light py-5 d-flex justify-content-center">
    <div class="contact-card card shadow-sm border-0 w-100 mx-3">
        <div class="card-header border-0 text-white p-4">
            <h3 class="fw-bold md-1">Liên hệ với chúng tôi</h3>
            <p class="mb-0 small">Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
        </div>

        <div class="card-body p-4 p-md-5">
            <form action="#">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="fullName" class="custom-label">Họ và tên</label>
                        <input type="text" class="form-control custom-input" id="fullName">
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="custom-label">Email</label>
                        <input type="text" class="form-control custom-input" id="email">
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="custom-label">Số điện thoại</label>
                        <input type="tel" class="form-control custom-input" id="phone">
                    </div>
                    <div class="col-md-6">
                        <label for="subject" class="custom-label">Chủ đề</label>
                        <select class="form-select custom-input" id="subject">
                            <option selected>Hỏi về khoá học</option>
                            <option value="1">Hỗ trợ kỹ thuật</option>
                            <option value="2">Góp ý khác</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label for="message" class="custom-label">Nội dung</label>
                        <textarea class="form-control custom-input" id="message" rows="4"></textarea>
                    </div>

                    <div class="col-12 d-flex flex-column flex-md-row justify-content-between align-items-md-end mt-4">
                        <div class="order-2 order-md-1 mt-4 mt-md-0">
                            <button type="submit" class="btn btn-submit px-4 py-2 me-2">Gửi liên hệ</button>
                            <button type="reset" class="btn btn-reset px-4 py-2">Nhập lại</button>
                        </div>
                        <div class="order-1 order-md-2 form-check d-flex align-items-start mb-2 mb-md-0">
                            <input class="form-check-input me-2 mt-1" type="checkbox" id="agree" checked>
                            <label for="agree" class="form-check-label text-secondary small">
                                Tôi đồng ý nhận email phản hồi.
                            </label>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
