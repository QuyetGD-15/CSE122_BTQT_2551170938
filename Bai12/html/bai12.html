<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12 - In lịch</title>
    <!-- Tích hợp Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- File CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-calendar d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-lg p-4 bg-white rounded-4" style="max-width: 500px; width: 100%;">
        
        <!-- Vùng hiển thị ô lịch -->
        <div class="calendar-box border rounded-3 p-3 text-center mb-3 mx-auto" style="width: 80%;">
            <div id="outYear" class="text-red fw-bold">2026</div>
            <div id="outMonth" class="text-blue fs-5">Tháng 12</div>
            <div id="outDay" class="text-red fw-bold day-number">24</div>
            <div id="outWeekday" class="text-blue fs-5">Thứ hai</div>
        </div>

        <!-- Lời chào theo buổi -->
        <div id="outGreeting" class="text-red text-center fst-italic mb-4 fs-5">
            Chào buổi sáng!
        </div>

        <!-- Form nhập liệu -->
        <div class="form-box border rounded-3 p-3 d-flex justify-content-between align-items-end gap-2">
            <div>
                <label class="form-label fw-bold text-center w-100 small mb-1">Ngày</label>
                <input type="number" id="inDay" class="form-control text-center" value="24">
            </div>
            <div>
                <label class="form-label fw-bold text-center w-100 small mb-1">Tháng</label>
                <input type="number" id="inMonth" class="form-control text-center" value="12">
            </div>
            <div>
                <label class="form-label fw-bold text-center w-100 small mb-1">Năm</label>
                <input type="number" id="inYear" class="form-control text-center" value="2026">
            </div>
            <div>
                <button id="btnPrint" class="btn btn-secondary px-3 py-2" style="background-color: #546E7A;">In<br>lịch</button>
            </div>
        </div>

    </div>

    <!-- Nhúng file JavaScript -->
    <script src="../js/script.js"></script>
</body>
</html>
