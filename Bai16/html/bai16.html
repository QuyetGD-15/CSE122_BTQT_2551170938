<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 16 - Danh sách việc cần làm</title>
    <!-- Tích hợp Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light d-flex justify-content-center align-items-center min-vh-100 py-5">

    <div class="app-container bg-white rounded-4 shadow overflow-hidden">
        
        <!-- Phần Header màu tím -->
        <div class="header-purple p-4 text-white">
            <h3 class="fw-bold mb-1">Danh sách việc cần làm</h3>
            <p class="mb-0 opacity-75 small">Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
        </div>

        <div class="p-4">
            <!-- Ô nhập liệu và Nút Thêm -->
            <div class="d-flex gap-2 mb-4 pb-4 border-bottom border-light">
                <input type="text" id="taskInput" class="form-control px-3" placeholder="Ví dụ: Hoàn thành bài tập Lập trình Web">
                <button id="addBtn" class="btn btn-purple px-4">Thêm</button>
            </div>

            <!-- Danh sách việc (UL) -->
            <ul id="taskList" class="list-unstyled mb-4">
                <!-- Các thẻ li sẽ được thêm bằng JavaScript -->
            </ul>

            <!-- Phần cập nhật số đếm -->
            <div class="text-secondary small mt-3 pt-3">
                Còn <span id="taskCount" class="fw-bold">0</span> việc chưa hoàn thành
            </div>
        </div>

    </div>

    <!-- Nhúng file JS -->
    <script src="../js/script.js"></script>
</body>
</html>
