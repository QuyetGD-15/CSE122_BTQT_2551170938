<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh (figure / figcaption)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="py-5 d-flex justify-content-center">
    <div class="gallery-container container p-4 p-md-5 rounded shadow">
        <div class="text-center mb-5">
            <h2 class="fw-bold md-2 text-white">Thư viện ảnh Việt Nam</h2>
            <p class="mb-0" style="color: #cbd5e1;">Bộ sưu tập 6 danh thắng tiêu biểu — minh hoạ thẻ figure / figcaption.</p>
        </div>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col">
                <figure class="custom-figure">
                    <img src="../image/1-vinh-ha-long.jpg" class="custom-img" alt="">
                    <figcaption class="custom-figcaption">Hình 1. Vịnh Hạ Long</figcaption>
                </figure>
            </div>
            <div class="col">
                <figure class="custom-figure">
                    <img src="../image/2-son-doong.jpg" class="custom-img" alt="Hang Sơn Đoòng">
                    <figcaption class="custom-figcaption">Hình 2. Hang Sơn Đoòng</figcaption>
                </figure>
            </div>

            <!-- Ảnh 3 -->
            <div class="col">
                <figure class="custom-figure">
                    <img src="../image/3-thac-ban-gioc.jpg" class="custom-img" alt="Thác Bản Giốc">
                    <figcaption class="custom-figcaption">Hình 3. Thác Bản Giốc</figcaption>
                </figure>
            </div>

            <!-- Ảnh 4 -->
            <div class="col">
                <figure class="custom-figure">
                    <img src="../image/4-fansipan.jpg" class="custom-img" alt="Fansipan">
                    <figcaption class="custom-figcaption">Hình 4. Fansipan</figcaption>
                </figure>
            </div>

            <!-- Ảnh 5 -->
            <div class="col">
                <figure class="custom-figure">
                    <img src="../image/5-mekong.jpg" class="custom-img" alt="Đồng bằng sông Cửu Long">
                    <figcaption class="custom-figcaption">Hình 5. Đồng bằng sông Cửu Long</figcaption>
                </figure>
            </div>

            <!-- Ảnh 6 -->
            <div class="col">
                <figure class="custom-figure">
                    <img src="../image/6-phong-nha.jpg" class="custom-img" alt="Động Phong Nha">
                    <figcaption class="custom-figcaption">Hình 6. Động Phong Nha</figcaption>
                </figure>
            </div>
        </div>
    </div>
    
</body>
</html>
