<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Bài 23 - Thư viện ảnh hiệu ứng Hover</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="bg-light py-5">
    <div class="container text-center" style="max-width: 900px;">

        <div class="gallery-grid">

                <img src="../image/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">

            </div>
            <div class="gallery-item">
                <img src="../image/4-fansipan.jpg" alt="Fansipan">
                <div class="overlay">Fansipan</div>
            </div>
            <div class="gallery-item">
                <img src="../image/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
                <div class="overlay">Đồng bằng sông Cửu Long</div>
